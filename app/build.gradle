plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cn.todaymcp.app'
    compileSdk 36

    defaultConfig {
        applicationId "cn.todaymcp.app"
        minSdk 30          // Android 11 起（你手机是 Android 16，没问题）
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 轻量 HTTP 服务器，用于跑 MCP 服务
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
